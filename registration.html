<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Ambition Tutorials</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div id="header-placeholder"></div>

    <main class="pt-5 mt-5">
        <section class="py-5">
            <div class="container container-custom">
                <div class="row g-0 rounded-5 overflow-hidden shadow-lg bg-white border">
                    <!-- Sidebar -->
                    <div class="col-lg-4 bg-navy text-white p-5 d-flex flex-column justify-content-center">
                        <img src="assets/ambition_logo.png" alt="Logo" class="img-fluid mb-4 bg-white p-2 rounded" style="max-width: 120px;">
                        <h2 class="display-6 fw-bold mb-4">Start Your <br><span class="text-gold">Journey</span> Today</h2>
                        <p class="opacity-75 mb-5">Join the league of extraordinary achievers. Fill out the form to begin your admission process.</p>
                        
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="bg-gold text-navy p-3 rounded-circle shadow-sm">
                                <i class="fas fa-headset"></i>
                            </div>
                            <div>
                                <p class="mb-0 small opacity-75">Need help?</p>
                                <p class="mb-0 fw-bold">+91 98765 43210</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Form Area -->
                    <div class="col-lg-8 p-5">
                        <div class="mb-5">
                            <h2 class="text-navy fw-bold mb-2">Student Registration</h2>
                            <p class="text-muted">Fields marked with <span class="text-danger">*</span> are mandatory.</p>
                        </div>
                        
                        <form id="registration-form" class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-navy small text-uppercase tracking-widest">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-lg border-2 rounded-4" placeholder="Enter full name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-navy small text-uppercase tracking-widest">Phone Number <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control form-control-lg border-2 rounded-4" placeholder="+91" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-navy small text-uppercase tracking-widest">Email Address</label>
                                <input type="email" class="form-control form-control-lg border-2 rounded-4" placeholder="yourname@email.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-navy small text-uppercase tracking-widest">Select Course <span class="text-danger">*</span></label>
                                <select class="form-select form-select-lg border-2 rounded-4 text-muted" required>
                                    <option value="" disabled selected>Choose program...</option>
                                    <option>School (5th-10th)</option>
                                    <option>11th-12th Science</option>
                                    <option>11th-12th Commerce</option>
                                    <option>CET/JEE Prep</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold text-navy small text-uppercase tracking-widest">Current School/College</label>
                                <input type="text" class="form-control form-control-lg border-2 rounded-4" placeholder="Name of your current institution">
                            </div>
                            <div class="col-12 mt-5">
                                <button type="submit" class="btn-premium w-100 py-3 rounded-pill fs-5 d-flex align-items-center justify-content-center gap-2">
                                    Next: Set Password <i class="fas fa-arrow-right"></i>
                                </button>
                                <p class="text-center mt-3 small text-muted">Step 1 of 2: Basic Information</p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/nav-footer.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
</body>
</html>
