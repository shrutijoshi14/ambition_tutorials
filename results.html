<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Ambition Tutorials</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="pt-5 mt-5">
        <section class="py-5 bg-navy text-white text-center">
            <div class="container">
                <h1 class="display-4 fw-bold mb-3" data-aos="fade-up">Wall of Fame</h1>
                <p class="lead opacity-75" data-aos="fade-up" data-aos-delay="100">Celebrating the extraordinary achievements of our brilliant students.</p>
            </div>
        </section>

        <section class="py-5">
            <div class="container container-custom">
                <!-- SSC Results Section -->
                <div class="mb-5" data-aos="fade-up">
                    <h2 class="text-navy fw-bold border-start border-gold border-5 ps-3 mb-4">SSC Class 10th Toppers</h2>
                    <div class="row g-4">
                        <!-- Topper 1 -->
                        <div class="col-lg-3 col-md-6">
                            <div class="premium-card text-center p-4">
                                <div class="topper-image-wrapper mb-3">
                                    <img src="https://images.unsplash.com/photo-1544717302-de2939b7ef71?q=80&w=200&auto=format&fit=crop" alt="Amit Verma" class="topper-img">
                                </div>
                                <h4 class="text-navy fw-bold mb-1">Amit Verma</h4>
                                <div class="mb-2"><span class="badge bg-gold text-navy rounded-pill">SSC Board</span></div>
                                <h2 class="text-maroon fw-bold mb-0">98.5%</h2>
                            </div>
                        </div>
                        <!-- Topper 2 -->
                        <div class="col-lg-3 col-md-6">
                            <div class="premium-card text-center p-4">
                                <div class="topper-image-wrapper mb-3">
                                    <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=200&auto=format&fit=crop" alt="Sneha Patil" class="topper-img">
                                </div>
                                <h4 class="text-navy fw-bold mb-1">Sneha Patil</h4>
                                <div class="mb-2"><span class="badge bg-gold text-navy rounded-pill">SSC Board</span></div>
                                <h2 class="text-maroon fw-bold mb-0">97.8%</h2>
                            </div>
                        </div>
                        <!-- Topper 3 -->
                        <div class="col-lg-3 col-md-6">
                            <div class="premium-card text-center p-4">
                                <div class="topper-image-wrapper mb-3">
                                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=200&auto=format&fit=crop" alt="Rohan Kulkarni" class="topper-img">
                                </div>
                                <h4 class="text-navy fw-bold mb-1">Rohan Kulkarni</h4>
                                <div class="mb-2"><span class="badge bg-gold text-navy rounded-pill">SSC Board</span></div>
                                <h2 class="text-maroon fw-bold mb-0">96.4%</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- HSC Results Section -->
                <div class="mb-5 mt-5" data-aos="fade-up">
                    <h2 class="text-navy fw-bold border-start border-maroon border-5 ps-3 mb-4">HSC Class 12th Toppers</h2>
                    <div class="row g-4">
                        <!-- Topper 4 -->
                        <div class="col-lg-3 col-md-6">
                            <div class="premium-card text-center p-4">
                                <div class="topper-image-wrapper mb-3" style="border-color: var(--accent-maroon) !important;">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" alt="Priya Sharma" class="topper-img">
                                </div>
                                <h4 class="text-navy fw-bold mb-1">Priya Sharma</h4>
                                <div class="mb-2"><span class="badge bg-maroon text-white rounded-pill">HSC Science</span></div>
                                <h2 class="text-navy fw-bold mb-0">97.2%</h2>
                            </div>
                        </div>
                        <!-- Topper 5 -->
                        <div class="col-lg-3 col-md-6">
                            <div class="premium-card text-center p-4">
                                <div class="topper-image-wrapper mb-3">
                                    <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=200&auto=format&fit=crop" alt="Vikram Deshpande" class="topper-img">
                                </div>
                                <h4 class="text-navy fw-bold mb-1">Vikram Deshpande</h4>
                                <div class="mb-2"><span class="badge bg-maroon text-white rounded-pill">HSC Commerce</span></div>
                                <h2 class="text-navy fw-bold mb-0">95.5%</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/nav-footer.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
</body>
</html>
